<script>
  function openLightbox(src) {
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      lightbox.style.display = 'flex';
    }

    // Animation fade-in
    window.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
    });
       // Ajouter effet fade-out sur les liens internes
    const links = document.querySelectorAll("a[href]");
    links.forEach(link => {
        link.addEventListener("click", function (e) {
            const href = this.getAttribute("href");

            // Ignore les liens externes ou ancrages
            if (!href.startsWith("http") && !href.startsWith("#")) {
                e.preventDefault();
                document.body.classList.remove("fade-in");
                document.body.classList.add("fade-out");
                setTimeout(() => {
                    window.location.href = href;
                }, 400); // délai identique à la durée de l'animation CSS
            }
        });
    });
  
    function ouvrirPDF() {
  const lightbox = document.getElementById("pdf-lightbox");
  lightbox.classList.remove("fade-out");
  lightbox.style.display = "flex";
  document.body.style.overflow = "hidden"; // Empêche scroll fond
}

function fermerPDF(event) {
  const lightbox = document.getElementById("pdf-lightbox");
  lightbox.classList.add("fade-out");
  setTimeout(() => {
    lightbox.style.display = "none";
    lightbox.classList.remove("fade-out");
    document.body.style.overflow = ""; // Réactive scroll
  }, 400);
  event.stopPropagation();
}
</script>

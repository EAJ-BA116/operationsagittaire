<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Construction de la maquette</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
        body {
      margin: 0;
      padding: 0;
     
    }

    #pdf-container {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      background-color: #f2f2f2;
      bottom: 100px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      max-width: 100vw;
      height: auto;
    }

    /* --- Bloc "Voir le scan" --- */
    .scan-container {
      position: relative;
      max-width: 360px;
      margin: 40px auto;
      cursor: pointer;
      border-radius: 12px;
      overflow: hidden;
    }

    .scan-container img {
      width: 100%;
      display: block;
      border-radius: 12px;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .scan-container:hover img {
      transform: scale(1.05);
      filter: brightness(0.8);
    }

    .scan-button {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(0,0,0,0.6);
      background: rgba(0,0,0,0.35);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .scan-container:hover .scan-button {
      opacity: 1;
    }

    /* Animation fade-in/out globale */
    body { opacity: 0; transition: opacity .4s ease; }
    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }
  </style>
</head>
<body>
    <h1>Opération Sagittaire</h1>
  <main>
     <div id="pdf-container"></div>

    <!-- Image avec bouton "Voir le scan" -->
    <figure id="openScan" class="scan-container">
      <img src="images/maquette.jpg" alt="Voir le scan 3D">
      <div class="scan-button">▶ Voir le scan</div>
    </figure>
  </main>

<Footer>
      <a href="index.html" class="footer-btn">Retour à l'accueil</a>
          <img src="images/ba116.png" alt="Décor gauche" class="img-gauche">
          <p><br></p>
        <p style="color: #030f19;position: relative;bottom: 120%;font-size: 0.7rem;"> <strong>EAJ BA 116</strong> - 2025</p>
        
        <img src="images/eaj.png" alt="Décor droite" class="img-droite">
      </footer> 
 <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
  // --- Animation d'apparition au chargement ---
  window.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("fade-in");
    initPdf();
    initInternalLinks();
    initScan();
  });

  // --- Affichage du PDF ---
  function initPdf() {
    const url = 'pdf/maquette.pdf';
    const container = document.getElementById('pdf-container');
    const loadingTask = pdfjsLib.getDocument(url);

    loadingTask.promise.then(function (pdf) {
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(function (page) {
          const viewport = page.getViewport({ scale: 1.4 });
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.width = viewport.width;
          canvas.height = viewport.height;

          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };

          page.render(renderContext);
          container.appendChild(canvas);
        });
      }
    });
  }

  // --- Animation d’apparition au chargement des liens internes ---
  function initInternalLinks() {
    const links = document.querySelectorAll("a[href]");
    links.forEach(link => {
      link.addEventListener("click", function (e) {
        const href = this.getAttribute("href");
        // On ne touche qu'aux liens internes
        if (!href || href.startsWith("http") || href.startsWith("#")) return;
        e.preventDefault();
        window.location.href = href;
      });
    });
  }

  // --- Clic sur l'image => ouvre le scan dans la même page (sans fade-out) ---
  function initScan() {
    const scanUrl = "https://scaniverse.com/scan/whqyki3n5yhp6dn5";
    const image = document.getElementById("openScan");
    if (!image) return;

    image.addEventListener("click", () => {
      window.location.href = scanUrl;
    });
  }
</script>

</body>
</html>

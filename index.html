<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opération Sagittaire</title>
    <style>
        /* Style global élégant et moderne */
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
            background: linear-gradient(180deg, #0b0c10, #1f2833);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }

        h1 {
            margin-top: 30px;
            font-size: 2em;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            color: #66fcf1;
            text-shadow: 0 0 10px #45a29e;
        }

        video {
            width: 90%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.4);
            margin: 20px 0;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        footer p {
            font-size: 1em;
            margin: 10px 0 5px 0;
            color: #c5c6c7;
        }

        .logos {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .logos img {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        /* Adaptation mobile */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }

            .logos img {
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <h1>Opération Sagittaire</h1>

    <video controls poster="EAJ.png">
        <source src="operaionsagittaire.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la lecture vidéo.
    </video>

    <footer>
        <p>Réalisé par les EAJ de Luxeuil - BA116</p>
        <div class="logos">
            <img src="EAJ.png" alt="Logo EAJ">
            <img src="BA116.png" alt="Logo BA116">
        </div>
    </footer>

</body>
</html>

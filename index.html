<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opération Sagittaire - Site en construction</title>
    <style>
        /* Styles de base pour tous les navigateurs */
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        img.logo {
            width: 120px;
            max-width: 80%;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #fca311;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #cccccc;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <main>
        <!-- Logo (à remplacer par ton fichier local si besoin) -->
        <img src="logo-eaj.png" alt="Logo des EAJ de Luxeuil" class="logo">
        
        <h1>Opération Sagittaire</h1>
        <p>Ce site est actuellement en construction.</p>
        <p>Réalisé par les équipes des EAJ de Luxeuil.</p>
        <p>Revenez bientôt pour en savoir plus !</p>
    </main>

    <footer>
        &copy; 2025 EAJ Luxeuil - Tous droits réservés
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opération Sagittaire</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ----- RESET DE BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(180deg, #22316d, #0c131c);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 2rem;
      color: #7df5ff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h2 {
      margin: 10px 0 30px;
      font-size: 1.3rem;
      font-weight: 400;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ----- CONTENEUR VIDÉO ----- */
    .video-frame {
      position: relative;
      width: min(100%, 960px);
      margin: 0 auto 40px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .video-frame::before {
      content: "";
      display: block;
      padding-top: 56.25%; /* ratio 16:9 */
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ----- BOUTON ----- */
    .footer-btn {
      display: inline-block;
      padding: 10px 25px;
      border: none;
      border-radius: 25px;
      background-color: rgba(76, 157, 192, 0.85);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .footer-btn:hover {
      background-color: #29313b;
      transform: translateY(-3px);
    }

    /* ----- PIED DE PAGE ----- */
    footer {
      position: relative;
      padding: 15px 0 5px;
      background: linear-gradient(180deg, #183249, #214c66);
      border-top: 2px solid rgba(255, 255, 255, 0.1);
    }

    footer img {
      width: 70px;
      height: auto;
      position: absolute;
      bottom: 10px;
    }

    .img-gauche {
      left: 10px;
    }

    .img-droite {
      right: 10px;
    }

    footer p {
      font-size: 0.7rem;
      color: #030f19;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.1rem;
      }
      footer img {
        width: 55px;
      }
    }
  </style>
</head>
<body>
  <h1>Opération Sagittaire</h1>
  <h2>EAJ t'AIR : Le reportage Vidéo</h2>

  <main>
    <div class="video-frame">
      <iframe
        src="https://drive.google.com/file/d/1Cl4wTJdq62hUrV407t-9qyG9W4iYsTHL/preview"
        allow="autoplay"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <footer>
    <img src="images/ba116.png" alt="Décor gauche" class="img-gauche">
    <a href="index.html" class="footer-btn">Retour à l'accueil</a>
    <p><strong>EAJ BA 116</strong> - 2025</p>
    <img src="images/eaj.png" alt="Décor droite" class="img-droite">
  </footer>
</body>
</html>
